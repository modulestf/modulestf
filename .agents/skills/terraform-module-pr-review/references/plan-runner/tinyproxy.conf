# tinyproxy configuration for the plan runner's egress proxy. The image turns it into
# init.conf and plan.conf by replacing @ALLOWLIST@ with the phase's allowlist.
Port 8888
Listen 0.0.0.0
Timeout 120
MaxClients 64

# Log every connection, and every refusal, to standard output. run-plan.sh copies the
# container log into the record.
LogLevel Connect

# The filter matches the whole request target. For CONNECT that is "host:443", so each
# allowlist line ends in ":443$"; a plain HTTP request's target is a full "http://" URL,
# which no line matches, so plain HTTP is refused.
Filter "@ALLOWLIST@"
FilterType ere
FilterURLs On
FilterCaseSensitive Off
FilterDefaultDeny Yes

# CONNECT only to 443.
ConnectPort 443

# No proxy identification headers.
DisableViaHeader Yes
