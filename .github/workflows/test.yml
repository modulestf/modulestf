name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep zsh
      - name: Run tests
        run: |
          rc=0
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; rc=1; }
            echo "::endgroup::"
          done
          exit "$rc"
