name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        name: List the suites
        run: echo "jobs=$(bash tests/run-all.sh --list)" >> "$GITHUB_OUTPUT"

  suite:
    needs: list
    name: ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # reviewer-index-test.sh compares sentences with a recorded base commit
      - name: Install test tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep zsh
      # The suites that run the real mtf-facts get the pinned release, its hash checked;
      # a wrong hash fails the job. No other suite sees it.
      - name: Install the pinned mtf-facts
        if: matrix.suite == 'skills-test.sh' || matrix.suite == 'review-run-test.sh' || matrix.suite == 'verify-pass-test.sh' || matrix.suite == 'skip-coverage-test.sh' || matrix.suite == 'ladder-pass-test.sh'
        run: |
          mkdir -p "$RUNNER_TEMP/mtf-facts"
          bash .agents/skills/terraform-module-pr-review/references/mtf-facts-install.sh "$RUNNER_TEMP/mtf-facts"
          {
            echo "MTF_FACTS=$RUNNER_TEMP/mtf-facts/mtf-facts"
            echo "MTF_FACTS_BIN=$RUNNER_TEMP/mtf-facts/mtf-facts"
            echo "MTF_FACTS_REQUIRED=1"
            echo "LADDER_TEST_FIXTURE_BUILD=$RUNNER_TEMP/mtf-facts/mtf-facts"
          } >> "$GITHUB_ENV"
      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
          PR_FIX_TEST_SHARD: ${{ matrix.shard }}
        run: bash "tests/$SUITE"

  # One stable check name over the whole matrix.
  test:
    needs: [list, suite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every suite passed
        env:
          LIST: ${{ needs.list.result }}
          SUITES: ${{ needs.suite.result }}
        run: |
          echo "list: $LIST, suites: $SUITES"
          [ "$LIST" = success ] && [ "$SUITES" = success ]
